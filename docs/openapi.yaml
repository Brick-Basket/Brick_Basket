        '422':
          description: Validation failure — see docs/VALIDATION_RULES.md.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Payments
      summary: Edit a bank transaction
      security:
      - sessionAuth: []
      description: Every field is editable — no confirmed relational identity to lock.
      x-required-permission: finance:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBankTransactionInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankTransaction'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but missing the required permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Unknown or not-visible record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failure — see docs/VALIDATION_RULES.md.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/contracts:
    get:
      tags:
      - Contracts
      summary: List/search/filter/sort/paginate contracts
      security:
      - sessionAuth: []
      description: Customer-facing responses must never include status:draft contracts.
      x-required-permission: contracts:read
      parameters:
      - name: search
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      - name: customerId
        in: query
        schema:
          type: string
        description: backend must independently scope a customer-role request to their own contracts
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          default: 10
      - name: sortBy
        in: query
        schema:
          type: string
          enum:
          - createdAt
          - updatedAt
          - status
          - title
          default: createdAt
      - name: sortDir
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contract'
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
                required:
                - items
                - total
                - page
                - pageSize
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but missing the required permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Contracts
      summary: Create a contract
      security:
      - sessionAuth: []
      description: 'Always created as status: draft.'
      x-required-permission: contracts:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContractInput'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but missing the required permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Unknown or not-visible record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failure — see docs/VALIDATION_RULES.md.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/contracts/{id}:
    get:
      tags:
      - Contracts
      summary: Contract detail
      security:
      - sessionAuth: []
      description: 404 if not found, or if a customer requests a contract that isn't theirs (never 403).
      x-required-permission: contracts:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: null
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but missing the required permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Unknown or not-visible record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failure — see docs/VALIDATION_RULES.md.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Contracts
      summary: Edit a contract
      security:
      - sessionAuth: []
      description: Only valid while status is draft or declined (409 otherwise). Editing a declined contract
        resets it to draft.
      x-required-permission: contracts:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContractInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but missing the required permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Unknown or not-visible record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Valid request, wrong state for this transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failure — see docs/VALIDATION_RULES.md.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/contracts/{id}/audit:
