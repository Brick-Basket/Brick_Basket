components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: TBD
      description: 'PLACEHOLDER — the auth/session model is unconfirmed (docs/OPEN_QUESTIONS.md #7). The
        frontend''s Part 3 mock is entirely client-side (localStorage), with no server verification at
        all, so there is nothing real to mirror here yet. Modeled provisionally as an httpOnly session
        cookie (the option docs/OPEN_QUESTIONS.md #7 names as the likely real-backend shape) rather than
        a bearer JWT — change this scheme, not just its `name`, once the backend''s actual auth model
        is confirmed.'
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      schema:
        type: integer
        default: 10
  schemas:
    ACEItem:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        category:
          $ref: '#/components/schemas/ContractCategory'
        itemDescription:
          type: string
        uom:
          type: string
        rate:
          type: number
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - projectId
      - category
      - itemDescription
      - uom
      - rate
      - createdAt
      - updatedAt
    AppNotification:
      type: object
      properties:
        id:
          type: string
          description: '"${category}:${entityId}[:suffix]" — not backend-issued'
        category:
          type: string
          enum:
          - lead
          - requisition
          - purchase_order
          - grn
          - tax
          - schedule
          - contract
          - mrc
        severity:
          type: string
          enum:
          - info
          - warning
          - urgent
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        href:
          type: string
      required:
      - id
      - category
      - severity
      - message
      - createdAt
      - href
    Approval:
      type: object
      properties:
        id:
          type: string
        purchaseOrderId:
          type: string
        level:
          type: integer
          description: 1 or 2
        decision:
          type: string
          enum:
          - approved
          - rejected
        decidedBy:
          type: string
        decidedByName:
          type: string
        comment:
          type: string
        decidedAt:
          type: string
          format: date-time
      required:
      - id
      - purchaseOrderId
      - level
      - decision
      - decidedBy
      - decidedByName
      - decidedAt
    BankTransaction:
      type: object
      properties:
        id:
          type: string
        paymentId:
          type: string
        partyOrVendorCode:
          type: string
        paymentAmount:
          type: number
        invoiceNumber:
          type: string
        accountNumber:
          type: string
        utrNumber:
          type: string
        projectId:
          type: string
        yearOfExecution:
          type: integer
        state:
          type: string
        city:
          type: string
        taxAmount:
          type: number
        tdsDetails:
          type: string
        gstin:
          type: string
        taxComponent:
          type: string
        itcApplicable:
          type: boolean
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - partyOrVendorCode
      - paymentAmount
      - invoiceNumber
      - projectId
      - yearOfExecution
      - state
      - city
      - taxAmount
      - itcApplicable
      - createdAt
      - updatedAt
    Contract:
      type: object
      properties:
        id:
          type: string
        contractNumber:
          type: string
        title:
          type: string
        customerId:
          type: string
        leadId:
          type: string
        projectId:
          type: string
        status:
          type: string
          enum:
          - draft
          - sent_for_acceptance
          - accepted
          - declined
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/ContractLineItem'
        notes:
          type: string
        sentAt:
          type: string
          format: date-time
          nullable: true
        respondedAt:
          type: string
          format: date-time
          nullable: true
        declineReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - contractNumber
      - title
      - customerId
      - status
      - lineItems
      - createdAt
      - updatedAt
    ContractAuditEntry:
      type: object
      properties:
