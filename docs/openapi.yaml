      tags:
      - Contracts
      summary: Acceptance/audit history
      security:
      - sessionAuth: []
      x-required-permission: contracts:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: null
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContractAuditEntry'
        '401':
