openapi: 3.1.0
info:
  title: BrickBasket API
  version: 0.20.0
  description: Real, non-invented contracts mirroring docs/API_CONTRACTS.md 1:1 — the mock adapters (src/lib/api/adapters/*.ts)
    are the executable spec this file documents. Nothing here is authoritative until a real backend implements
    it and the two sides reconcile per docs/BACKEND_CLAUDE_HANDOFF.md. See docs/OPENAPI.md for how to
    read this file, including every place it's intentionally marked TBD rather than guessed.
  contact:
    name: BrickBasket Frontend — see docs/BACKEND_CLAUDE_HANDOFF.md
servers:
- url: TBD
  description: Backend server URL — requires confirmation. No environment (dev/staging/prod) has been
    provisioned yet; see docs/ENVIRONMENT_VARIABLES.md.
tags:
- name: Leads
  description: Lead Management (Part 2/4)
- name: Contracts
  description: Contract Management (Part 5)
- name: Documents
  description: Drawing & Document Management (Part 6)
- name: Vendors
  description: Vendor Management (Part 7)
- name: ACE
  description: Accepted Cost Estimate (Part 8)
- name: Requisitions
  description: Purchase / Material Requisition (Part 8)
- name: RFQ
  description: RFQ Management (Part 9)
- name: PurchaseOrders
  description: Purchase Orders (Part 10)
- name: GRN
  description: Store Management — GRN (Part 11)
- name: Stock
  description: Store Management — Stock Statement (Part 11)
- name: Wastage
  description: Store Management — Wastage (Part 11)
- name: MRC
  description: Material Receipt Certificate (Part 12)
- name: Schedule
  description: Project Schedule + Tracking (Part 13)
- name: DPR
  description: Daily Progress Report (Part 14)
- name: CostAccounting
  description: Project Cost Accounting (Part 15)
- name: Payments
  description: Payments & Receipts + Bank & Cash (Part 16)
- name: Finance
  description: Taxes, Fixed Assets & GSTR (Part 17)
- name: CostToComplete
  description: Cost-to-Complete (Part 18)
- name: CrossModule
  description: Notifications & Ops Dashboard Metrics (Part 19)
security:
- sessionAuth: []
paths:
  /api/ace-items:
    get:
      tags:
      - ACE
      summary: List/search/filter/sort/paginate ACE items
      security:
      - sessionAuth: []
      x-required-permission: ace:read
      parameters:
      - name: search
        in: query
        schema:
          type: string
      - name: projectId
        in: query
        schema:
          type: string
      - name: category
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          default: 10
      - name: sortBy
        in: query
        schema:
          type: string
          enum:
          - itemDescription
          - category
          - rate
          - createdAt
          default: createdAt
      - name: sortDir
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ACEItem'
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
                required:
                - items
                - total
                - page
                - pageSize
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but missing the required permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - ACE
      summary: Create an ACE item
      security:
      - sessionAuth: []
      x-required-permission: ace:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateACEItemInput'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ACEItem'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but missing the required permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Unknown or not-visible record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failure — see docs/VALIDATION_RULES.md.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/ace-items/{id}:
    get:
      tags:
      - ACE
      summary: ACE item detail
      security:
      - sessionAuth: []
      x-required-permission: ace:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: null
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ACEItem'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but missing the required permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Unknown or not-visible record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failure — see docs/VALIDATION_RULES.md.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - ACE
      summary: Edit an ACE item
      security:
      - sessionAuth: []
      description: projectId is immutable after creation.
      x-required-permission: ace:write
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateACEItemInput'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ACEItem'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but missing the required permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Unknown or not-visible record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failure — see docs/VALIDATION_RULES.md.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/bank-transactions:
    get:
      tags:
      - Payments
      summary: List/search/filter/sort/paginate bank transactions
      security:
      - sessionAuth: []
      x-required-permission: finance:read
      parameters:
      - name: search
        in: query
        schema:
          type: string
      - name: projectId
        in: query
        schema:
          type: string
      - name: yearOfExecution
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          default: 10
      - name: sortBy
        in: query
        schema:
          type: string
          enum:
          - createdAt
          - paymentAmount
          - yearOfExecution
          default: createdAt
      - name: sortDir
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/BankTransaction'
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
                required:
                - items
                - total
                - page
                - pageSize
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but missing the required permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Payments
      summary: Create a bank transaction
      security:
      - sessionAuth: []
      description: When paymentId is provided, rejects with 422 if that Payment doesn't exist.
      x-required-permission: finance:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBankTransactionInput'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankTransaction'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but missing the required permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Unknown or not-visible record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failure — see docs/VALIDATION_RULES.md.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/bank-transactions/{id}:
