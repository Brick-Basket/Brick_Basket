  /api/contracts/{id}/respond:
    post:
      tags:
      - Contracts
      summary: 'Customer: accept or decline'
      security:
      - sessionAuth: []
      x-required-permission: contracts:accept
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                  enum:
                  - accepted
                  - declined
                declineReason:
                  type: string
              required:
              - decision
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '401':
